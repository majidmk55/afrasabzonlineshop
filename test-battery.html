<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battery Comparison Test</title>
  <style>
    body {
      font-family: 'Inter', 'Roboto', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    h1 {
      margin-bottom: 20px;
      color: #1a1a2e;
    }

    .section {
      margin-bottom: 32px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .section-header svg {
      width: 20px;
      height: 20px;
    }

    .section-header span {
      font-size: 18px;
      font-weight: bold;
      color: #1a1a2e;
    }

    .row {
      display: grid;
      grid-template-columns: 30% 35% 35%;
      min-height: 40px;
      border-bottom: 1px solid #e8e8e8;
    }

    .label {
      padding: 12px 16px;
      font-size: 14px;
      color: #666666;
      display: flex;
      align-items: center;
    }

    .value {
      padding: 12px 16px;
      font-size: 14px;
      color: #333333;
      display: flex;
      align-items: center;
    }

    .value.highlight {
      background-color: #d4edda;
    }

    .value.selector {
      color: #1a73e8;
    }

    .radio-button {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #1a73e8;
      margin-right: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .radio-button-inner {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Battery Comparison</h1>

    <div class="section">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="18" height="10" rx="1" fill="#1a73e8" />
          <rect x="20" y="10" width="2" height="4" fill="#1a73e8" />
        </svg>
        <span>Battery</span>
      </div>

      <div class="row">
        <div class="label">Capacity</div>
        <div class="value selector">
          <div class="radio-button">
            <div class="radio-button-inner"></div>
          </div>
          90 Wh
        </div>
        <div class="value selector">
          <div class="radio-button">
            <div class="radio-button-inner"></div>
          </div>
          65 Wh
        </div>
      </div>

      <div class="row">
        <div class="label">Battery type</div>
        <div class="value">Li Ion</div>
        <div class="value">Li Po</div>
      </div>

      <div class="row">
        <div class="label">Replaceable</div>
        <div class="value">No</div>
        <div class="value">No</div>
      </div>

      <div class="row">
        <div class="label">Fast charging</div>
        <div class="value">Yes</div>
        <div class="value">Yes</div>
      </div>

      <div class="row">
        <div class="label">Charging via USB (Power<br>Delivery)</div>
        <div class="value highlight">Yes, 100 W</div>
        <div class="value">Yes</div>
      </div>

      <div class="row">
        <div class="label">Charging port position</div>
        <div class="value">Left</div>
        <div class="value">Left</div>
      </div>

      <div class="row">
        <div class="label">Charge power</div>
        <div class="value highlight">280 W</div>
        <div class="value">65 W</div>
      </div>
    </div>
  </div>
</body>
</html>
