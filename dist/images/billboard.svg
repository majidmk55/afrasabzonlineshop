<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect fill="url(#bg)" width="1600" height="900"/>
  <g filter="url(#shadow)">
    <rect x="200" y="250" width="400" height="260" rx="10" fill="#1a1a1a"/>
    <rect x="220" y="270" width="360" height="220" rx="6" fill="#00d4ff"/>
    <rect x="700" y="280" width="350" height="230" rx="10" fill="#c0c0c0"/>
    <rect x="720" y="300" width="310" height="190" rx="6" fill="#1a1a2e"/>
    <rect x="1150" y="260" width="380" height="250" rx="10" fill="#2a2a2a"/>
    <rect x="1170" y="280" width="340" height="210" rx="6" fill="#ff0080"/>
  </g>
  <text x="800" y="700" font-family="Arial,sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">افرالینک - فروشگاه تخصصی لپ‌تاپ</text>
</svg>
